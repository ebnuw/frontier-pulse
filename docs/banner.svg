<svg xmlns="http://www.w3.org/2000/svg" width="820" height="150" viewBox="0 0 820 150" xml:space="preserve" role="img" aria-label="Frontier Pulse quest card: live dashboard of what Entropy's pre-IPO perps say Anthropic and OpenAI are worth">
  <style>
    text { font-family: "Courier New", ui-monospace, monospace; fill: #efe4cf; }
    .lbl { fill: #c9a45c; font-size: 14px; }
    .big { font-size: 30px; font-weight: 700; letter-spacing: 2px; }
    .t { font-size: 16px; }
    .dim { fill: #8a7a66; font-size: 13px; }
    .st { font-size: 16px; font-weight: 700; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .eyes { animation: peek 5s steps(1) infinite; }
    @keyframes peek { 0%, 92% { opacity: 1; } 93%, 97% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a211a"/>
      <stop offset="1" stop-color="#0c0a08"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="812" height="142" rx="10" fill="url(#win)" stroke="#c9a45c" stroke-width="3"/>
  <rect x="10" y="10" width="800" height="130" rx="7" fill="none" stroke="#5a4632" stroke-width="1.5"/>

  <text x="34" y="34" class="lbl">QUEST</text>
  <text x="34" y="70" class="big">FRONTIER PULSE</text>
  <text x="34" y="98" class="t">What pre-IPO perps say Anthropic and OpenAI are worth</text>
  <text x="34" y="124" class="dim">Entropy data · unofficial · not financial advice</text>

  <line x1="600" y1="26" x2="600" y2="124" stroke="#5a4632" stroke-width="1.5"/>
  <text x="622" y="48" class="lbl">STATUS</text>
  <text x="622" y="76" class="st" fill="#9fd49a" style="fill:#9fd49a"><tspan class="cursor">&#9654;</tspan> LIVE</text>
  <text x="622" y="104" class="dim">rebuilt every 30 min</text>

  <g transform="translate(758 20) scale(0.82)">
    <path d="M6 22 L2 2 L16 14 Z M44 22 L48 2 L34 14 Z" fill="#050403" stroke="#5a4632" stroke-width="1.2"/>
    <ellipse cx="25" cy="30" rx="22" ry="18" fill="#050403" stroke="#5a4632" stroke-width="1.2"/>
    <path d="M6 46 L2 56 L12 49 Z M44 46 L48 56 L38 49 Z" fill="#050403" stroke="#5a4632" stroke-width="1.2"/>
    <g class="eyes"><circle cx="17" cy="27" r="4" fill="#efe4cf"/><circle cx="33" cy="27" r="4" fill="#efe4cf"/></g>
    <path d="M13 37 l3 4 l3 -4 l3 4 l3 -4 l3 4 l3 -4 l3 4 l3 -4" stroke="#b8453a" stroke-width="2" fill="none" stroke-linejoin="round"/>
  </g>
</svg>
